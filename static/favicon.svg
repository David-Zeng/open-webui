<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Dark background -->
  <rect width="512" height="512" rx="80" fill="#0a0e1a"/>

  <!-- Outer hexagon glow -->
  <polygon points="256,80 390,158 390,354 256,432 122,354 122,158"
    fill="none" stroke="#0055ff" stroke-width="3" opacity="0.4"/>

  <!-- Middle hexagon -->
  <polygon points="256,108 366,170 366,342 256,404 146,342 146,170"
    fill="none" stroke="#1a6fff" stroke-width="4" opacity="0.7"/>

  <!-- Inner hexagon filled -->
  <polygon points="256,136 342,184 342,330 256,376 170,330 170,184"
    fill="#0a1a3a" stroke="#3d8bff" stroke-width="5"/>

  <!-- Circuit lines - top left -->
  <line x1="170" y1="220" x2="120" y2="220" stroke="#1a6fff" stroke-width="2.5" opacity="0.8"/>
  <line x1="120" y1="220" x2="120" y2="180" stroke="#1a6fff" stroke-width="2.5" opacity="0.8"/>
  <circle cx="120" cy="180" r="5" fill="#3d8bff" opacity="0.9"/>

  <!-- Circuit lines - top right -->
  <line x1="342" y1="220" x2="392" y2="220" stroke="#1a6fff" stroke-width="2.5" opacity="0.8"/>
  <line x1="392" y1="220" x2="392" y2="180" stroke="#1a6fff" stroke-width="2.5" opacity="0.8"/>
  <circle cx="392" cy="180" r="5" fill="#3d8bff" opacity="0.9"/>

  <!-- Circuit lines - bottom left -->
  <line x1="170" y1="300" x2="110" y2="300" stroke="#1a6fff" stroke-width="2.5" opacity="0.8"/>
  <line x1="110" y1="300" x2="110" y2="340" stroke="#1a6fff" stroke-width="2.5" opacity="0.8"/>
  <circle cx="110" cy="340" r="5" fill="#3d8bff" opacity="0.9"/>

  <!-- Circuit lines - bottom right -->
  <line x1="342" y1="300" x2="402" y2="300" stroke="#1a6fff" stroke-width="2.5" opacity="0.8"/>
  <line x1="402" y1="300" x2="402" y2="340" stroke="#1a6fff" stroke-width="2.5" opacity="0.8"/>
  <circle cx="402" cy="340" r="5" fill="#3d8bff" opacity="0.9"/>

  <!-- Circuit lines - top center -->
  <line x1="256" y1="136" x2="256" y2="86" stroke="#1a6fff" stroke-width="2.5" opacity="0.8"/>
  <line x1="230" y1="86" x2="282" y2="86" stroke="#1a6fff" stroke-width="2.5" opacity="0.8"/>
  <circle cx="230" cy="86" r="5" fill="#3d8bff" opacity="0.9"/>
  <circle cx="282" cy="86" r="5" fill="#3d8bff" opacity="0.9"/>

  <!-- Circuit lines - bottom center -->
  <line x1="256" y1="376" x2="256" y2="426" stroke="#1a6fff" stroke-width="2.5" opacity="0.8"/>
  <line x1="230" y1="426" x2="282" y2="426" stroke="#1a6fff" stroke-width="2.5" opacity="0.8"/>
  <circle cx="230" cy="426" r="5" fill="#3d8bff" opacity="0.9"/>
  <circle cx="282" cy="426" r="5" fill="#3d8bff" opacity="0.9"/>

  <!-- "DJ" text -->
  <text x="256" y="285" font-family="Arial Black, Arial, sans-serif" font-weight="900"
    font-size="110" text-anchor="middle" fill="white" letter-spacing="-4">DJ</text>

  <!-- Inner glow overlay -->
  <polygon points="256,136 342,184 342,330 256,376 170,330 170,184"
    fill="none" stroke="#7ab4ff" stroke-width="2" opacity="0.3"/>
</svg>
